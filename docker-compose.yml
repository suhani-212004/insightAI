# Full local stack:  docker compose up --build
# Then seed demo data: docker compose exec api python -m app.seed
#   Frontend  http://localhost:3000
#   API docs  http://localhost:8000/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: ./backend/.env
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg2://insight:insight@db:5432/insight
      READONLY_DATABASE_URL: postgresql+psycopg2://insight_readonly:insight_ro@db:5432/insight
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3000
      PRINT_BASE_URL: http://web:3000
      SAMPLE_DATA_DIR: /sample_data
    volumes:
      - ./sample_data:/sample_data:ro
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./backend
    command: arq app.workers.tasks.WorkerSettings
    env_file: ./backend/.env
    environment: *backend-env
    depends_on: [api]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
